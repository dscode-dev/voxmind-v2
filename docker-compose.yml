# ClipFlow — Docker Compose (single host).
#
# Build strategy (see README "Build"):
#   clipflow-api          → clipflow-api/Dockerfile          (multi-stage, python:3.11-slim)
#   voxmind-control-plane → control-plane/Dockerfile         (python:3.11-slim)
#   voxmind-worker-base   → worker/Dockerfile.gpu.base       (CUDA runtime + torch + ASR models)
#   voxmind-worker        → worker/Dockerfile.gpu            (FROM the base above)
#
# The worker's two-stage build is expressed with `additional_contexts: service:` so that a
# single `docker compose up -d --build` builds the base first and then the worker image.
# There is no hidden manual step. `scripts/build-worker.sh` does the same two builds
# explicitly for anyone who wants to build/cache the heavy base on its own.
#
# worker/Dockerfile (CPU-only, no CUDA) is a development/CI convenience and is NOT the
# production path. It is not referenced here.

services:
  redis:
    image: redis:7-alpine
    container_name: voxmind-redis
    restart: unless-stopped
    ports:
      # Bound to loopback: only the Compose network needs Redis. Override
      # REDIS_BIND_HOST if you must reach it from another machine.
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: voxmind-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # The API port must stay reachable from the browser: presigned asset URLs are signed
      # against MINIO_PUBLIC_ENDPOINT and are fetched directly by the client.
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/${MINIO_BUCKET} || true;
      mc mb -p local/${CLIPFLOW_MINIO_BUCKET} || true;
      exit 0;
      "
    restart: "no"

  clipflow-postgres:
    image: postgres:16-alpine
    container_name: clipflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Bound to loopback: only clipflow-api talks to Postgres.
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_EXPOSE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ==========================================================================
  # ClipFlow Studio - the operations console.
  #
  # A SEPARATE REPOSITORY. It is referenced here only as a build context so one
  # `docker compose up` brings the whole product up on a host; no code crosses the
  # boundary in either direction, and the Studio talks to the API over HTTP like any
  # other client.
  #
  # One image serves every environment: the browser configuration is written into
  # dist/runtime-config.js when the container starts, from the variables below. That is
  # why CLIPFLOW_PUBLIC_HOST matters - the browser resolves the API itself, so the URL
  # must be one the *browser* can reach, not one that only works inside the network.
  # ==========================================================================
  clipflow-studio:
    build:
      context: ./clipflow-studio
      # Overridable so a machine that needs a build-time workaround (a TLS-inspecting
      # proxy, an internal registry) does not have to edit a committed Dockerfile.
      dockerfile: ${CLIPFLOW_STUDIO_DOCKERFILE:-Dockerfile}
    image: ${CLIPFLOW_STUDIO_IMAGE:-clipflow-studio:local}
    container_name: clipflow-studio
    restart: unless-stopped
    depends_on:
      clipflow-api:
        condition: service_healthy
    environment:
      # Where the BROWSER reaches the API. On a LAN server this is the host's address, not
      # `clipflow-api` - that name only resolves inside the Compose network.
      VITE_CLIPFLOW_API_BASE: http://${CLIPFLOW_PUBLIC_HOST:-localhost}:${CLIPFLOW_API_PORT:-8010}
      # The session is an HttpOnly cookie on the API's origin, so cross-origin requests
      # must carry credentials. The API must also list this origin in CORS_ALLOWED_ORIGINS.
      VITE_CLIPFLOW_WITH_CREDENTIALS: "true"
      VITE_CLIPFLOW_BASENAME: ${CLIPFLOW_STUDIO_BASENAME:-/}
      VITE_CLIPFLOW_SSE_ENABLED: ${CLIPFLOW_STUDIO_SSE_ENABLED:-true}
    ports:
      - "${CLIPFLOW_STUDIO_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  clipflow-api:
    build:
      context: ./clipflow-api
      dockerfile: ${CLIPFLOW_API_DOCKERFILE:-Dockerfile}
    image: ${CLIPFLOW_API_IMAGE:-clipflow-api:local}
    container_name: clipflow-api
    restart: unless-stopped
    depends_on:
      clipflow-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@clipflow-postgres:5432/${POSTGRES_DB}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      # Must include the Studio's browser origin, or every request from it is blocked
      # before it reaches the API. Defaults to the Studio this compose file starts.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://${CLIPFLOW_PUBLIC_HOST:-localhost}:${CLIPFLOW_STUDIO_PORT:-3000}}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      DISCOVERY_MAX_RESULTS: ${DISCOVERY_MAX_RESULTS:-25}
      DISCOVERY_FRESHNESS_DAYS: ${DISCOVERY_FRESHNESS_DAYS:-7}
      DISCOVERY_HTTP_TIMEOUT_SEC: ${DISCOVERY_HTTP_TIMEOUT_SEC:-15}
      SELECTION_OPENAI_API_KEY: ${SELECTION_OPENAI_API_KEY:-}
      SELECTION_MODEL: ${SELECTION_MODEL:-gpt-4o-mini}
      SELECTION_TIMEOUT_SEC: ${SELECTION_TIMEOUT_SEC:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PUBLISHING_ENABLED: ${PUBLISHING_ENABLED:-false}
      PUBLISH_SECRET_KEY: ${PUBLISH_SECRET_KEY:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_OAUTH_REDIRECT_URI: ${YOUTUBE_OAUTH_REDIRECT_URI:-}
      YOUTUBE_UPLOAD_TIMEOUT_SEC: ${YOUTUBE_UPLOAD_TIMEOUT_SEC:-900}
      YOUTUBE_UPLOAD_CHUNK_MIB: ${YOUTUBE_UPLOAD_CHUNK_MIB:-8}
      PUBLISH_QUEUE_NAME: ${PUBLISH_QUEUE_NAME:-clipflow_publish_jobs}
      AUTOPUBLISH_ENABLED: ${AUTOPUBLISH_ENABLED:-false}
      AUTOPUBLISH_PUBLIC_ENABLED: ${AUTOPUBLISH_PUBLIC_ENABLED:-false}
      AUTOPUBLISH_DEFAULT_PRIVACY: ${AUTOPUBLISH_DEFAULT_PRIVACY:-private}
      AUTOPUBLISH_MAX_PER_TICK: ${AUTOPUBLISH_MAX_PER_TICK:-1}
      AUTOPUBLISH_MAX_PER_DAY: ${AUTOPUBLISH_MAX_PER_DAY:-3}
      AUTOPUBLISH_MAX_QUEUE_BACKLOG: ${AUTOPUBLISH_MAX_QUEUE_BACKLOG:-20}
      AUTOPUBLISH_MAX_DEAD_LETTER: ${AUTOPUBLISH_MAX_DEAD_LETTER:-10}
      OPERATIONS_DEAD_LETTER_THRESHOLD: ${OPERATIONS_DEAD_LETTER_THRESHOLD:-3}
      OPERATIONS_STALL_WINDOW_SEC: ${OPERATIONS_STALL_WINDOW_SEC:-1800}
      OPERATIONS_FAILURE_THRESHOLD: ${OPERATIONS_FAILURE_THRESHOLD:-3}
      AUTOMATION_HEARTBEAT_TTL_SEC: ${AUTOMATION_HEARTBEAT_TTL_SEC:-180}
      PUBLISH_TEMP_STALE_SEC: ${PUBLISH_TEMP_STALE_SEC:-21600}
      METRICS_COLLECTION_ENABLED: ${METRICS_COLLECTION_ENABLED:-false}
      METRICS_TRACKING_DAYS: ${METRICS_TRACKING_DAYS:-30}
      METRICS_INTERVAL_FRESH_HOURS: ${METRICS_INTERVAL_FRESH_HOURS:-1}
      METRICS_INTERVAL_RECENT_HOURS: ${METRICS_INTERVAL_RECENT_HOURS:-6}
      METRICS_INTERVAL_MATURE_HOURS: ${METRICS_INTERVAL_MATURE_HOURS:-24}
      METRICS_POLL_INTERVAL_SEC: ${METRICS_POLL_INTERVAL_SEC:-900}
      METRICS_MAX_VIDEOS_PER_RUN: ${METRICS_MAX_VIDEOS_PER_RUN:-200}
      METRICS_STALE_HOURS: ${METRICS_STALE_HOURS:-48}
      PUBLISHER_RUNTIME_ENABLED: "false"
      AUTONOMOUS_PIPELINE_ENABLED: ${AUTONOMOUS_PIPELINE_ENABLED:-false}
      AUTOMATION_POLL_INTERVAL_SEC: ${AUTOMATION_POLL_INTERVAL_SEC:-60}
      AUTOMATION_STARTUP_DELAY_SEC: ${AUTOMATION_STARTUP_DELAY_SEC:-15}
      AUTOMATION_RUNNER_ENABLED: ${AUTOMATION_RUNNER_ENABLED:-true}
      FIXED_TEST_OTP: ${FIXED_TEST_OTP:-}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_AUTH_CODE: ${BOOTSTRAP_ADMIN_AUTH_CODE:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PUBLICATION_METADATA_MODEL: ${PUBLICATION_METADATA_MODEL:-gpt-4o-mini}
      PUBLICATION_METADATA_TIMEOUT_SEC: ${PUBLICATION_METADATA_TIMEOUT_SEC:-30}
      DEFAULT_ADMIN_PHONE_NUMBER: ${DEFAULT_ADMIN_PHONE_NUMBER}
      DEFAULT_ADMIN_FULL_NAME: ${DEFAULT_ADMIN_FULL_NAME}
      DEFAULT_ADMIN_CREDITS: ${DEFAULT_ADMIN_CREDITS}
      LAB_UNLIMITED_CREDIT_PHONE_NUMBERS: ${LAB_UNLIMITED_CREDIT_PHONE_NUMBERS:-}
      # Internal endpoint: service-to-service traffic inside the Compose network.
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      # Public endpoint: the host:port a browser can reach. Presigned URLs are signed
      # against this, because SigV4 covers the Host header.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${CLIPFLOW_MINIO_BUCKET}
      WORKER_ARTIFACTS_BUCKET: ${MINIO_BUCKET}
      SIGNED_ASSET_URL_EXPIRY_SEC: ${SIGNED_ASSET_URL_EXPIRY_SEC}
      VOXMIND_REDIS_HOST: redis
      VOXMIND_REDIS_PORT: 6379
      VOXMIND_REDIS_QUEUE: ${VOXMIND_REDIS_QUEUE}
    ports:
      - "${CLIPFLOW_API_PORT:-8010}:8000"
    command: >
      /bin/sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Build-only service: produces the heavy CUDA/torch/ASR base image that voxmind-worker
  # builds FROM. Compose builds it first because voxmind-worker references it through
  # `additional_contexts`, which is what removes the manual two-step build.
  #
  # It is not a running component: like minio-init, it executes a no-op and exits 0. It
  # cannot use `profiles`, because a service hidden behind an inactive profile is not
  # resolvable as a build context.
  # The publication worker (PR-PUBLISH-QUEUE-01).
  #
  # Same image as the API, because that is where the publishing code lives and a third copy
  # of the codebase to run one loop would be worse than a second container from one image.
  # It shares nothing else: no HTTP port, no GPU, and its own restart lifecycle - an upload
  # that takes ten minutes must not be interrupted by an API deploy, and a publisher restart
  # must not drop requests.
  #
  # Deliberately NOT the GPU worker: publishing is network I/O, and queueing it behind ffmpeg
  # and ASR would make every publication wait for a render.
  clipflow-publisher:
    build:
      context: ./clipflow-api
      dockerfile: ${CLIPFLOW_API_DOCKERFILE:-Dockerfile}
    image: ${CLIPFLOW_API_IMAGE:-clipflow-api:local}
    container_name: clipflow-publisher
    restart: unless-stopped
    depends_on:
      clipflow-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clipflow-api:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@clipflow-postgres:5432/${POSTGRES_DB}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      DEFAULT_ADMIN_PHONE_NUMBER: ${DEFAULT_ADMIN_PHONE_NUMBER}
      DEFAULT_ADMIN_FULL_NAME: ${DEFAULT_ADMIN_FULL_NAME}
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${CLIPFLOW_MINIO_BUCKET}
      # The bucket the worker writes final media into: what the publisher reads.
      WORKER_ARTIFACTS_BUCKET: ${MINIO_BUCKET}
      VOXMIND_REDIS_HOST: redis
      VOXMIND_REDIS_PORT: 6379
      VOXMIND_REDIS_QUEUE: ${VOXMIND_REDIS_QUEUE}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The publisher is the one process that runs the loop.
      PUBLISHER_RUNTIME_ENABLED: "true"
      PUBLISHER_WORKER_ID: ${PUBLISHER_WORKER_ID:-}
      PUBLISHING_ENABLED: ${PUBLISHING_ENABLED:-false}
      PUBLISH_SECRET_KEY: ${PUBLISH_SECRET_KEY:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_OAUTH_REDIRECT_URI: ${YOUTUBE_OAUTH_REDIRECT_URI:-}
      YOUTUBE_UPLOAD_TIMEOUT_SEC: ${YOUTUBE_UPLOAD_TIMEOUT_SEC:-900}
      YOUTUBE_UPLOAD_CHUNK_MIB: ${YOUTUBE_UPLOAD_CHUNK_MIB:-8}
      PUBLISH_QUEUE_NAME: ${PUBLISH_QUEUE_NAME:-clipflow_publish_jobs}
      AUTOPUBLISH_ENABLED: ${AUTOPUBLISH_ENABLED:-false}
      AUTOPUBLISH_PUBLIC_ENABLED: ${AUTOPUBLISH_PUBLIC_ENABLED:-false}
      AUTOPUBLISH_DEFAULT_PRIVACY: ${AUTOPUBLISH_DEFAULT_PRIVACY:-private}
      AUTOPUBLISH_MAX_PER_TICK: ${AUTOPUBLISH_MAX_PER_TICK:-1}
      AUTOPUBLISH_MAX_PER_DAY: ${AUTOPUBLISH_MAX_PER_DAY:-3}
      AUTOPUBLISH_MAX_QUEUE_BACKLOG: ${AUTOPUBLISH_MAX_QUEUE_BACKLOG:-20}
      AUTOPUBLISH_MAX_DEAD_LETTER: ${AUTOPUBLISH_MAX_DEAD_LETTER:-10}
      OPERATIONS_DEAD_LETTER_THRESHOLD: ${OPERATIONS_DEAD_LETTER_THRESHOLD:-3}
      OPERATIONS_STALL_WINDOW_SEC: ${OPERATIONS_STALL_WINDOW_SEC:-1800}
      OPERATIONS_FAILURE_THRESHOLD: ${OPERATIONS_FAILURE_THRESHOLD:-3}
      AUTOMATION_HEARTBEAT_TTL_SEC: ${AUTOMATION_HEARTBEAT_TTL_SEC:-180}
      PUBLISH_TEMP_STALE_SEC: ${PUBLISH_TEMP_STALE_SEC:-21600}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PUBLICATION_METADATA_MODEL: ${PUBLICATION_METADATA_MODEL:-gpt-4o-mini}
      PUBLISH_MAX_ATTEMPTS: ${PUBLISH_MAX_ATTEMPTS:-3}
      PUBLISH_VISIBILITY_TIMEOUT_SEC: ${PUBLISH_VISIBILITY_TIMEOUT_SEC:-900}
      PUBLISH_HEARTBEAT_INTERVAL_SEC: ${PUBLISH_HEARTBEAT_INTERVAL_SEC:-20}
      PUBLISH_HEARTBEAT_TTL_SEC: ${PUBLISH_HEARTBEAT_TTL_SEC:-60}
      PUBLISH_CLAIM_BLOCK_SEC: ${PUBLISH_CLAIM_BLOCK_SEC:-5}
      PUBLISH_RETRY_BACKOFF_BASE_SEC: ${PUBLISH_RETRY_BACKOFF_BASE_SEC:-30}
      PUBLISH_RETRY_BACKOFF_MAX_SEC: ${PUBLISH_RETRY_BACKOFF_MAX_SEC:-900}
      PUBLISH_QUOTA_BACKOFF_SEC: ${PUBLISH_QUOTA_BACKOFF_SEC:-3600}
      PUBLISH_SWEEP_INTERVAL_SEC: ${PUBLISH_SWEEP_INTERVAL_SEC:-60}
      PUBLISH_SHUTDOWN_GRACE_SEC: ${PUBLISH_SHUTDOWN_GRACE_SEC:-30}
    # No ports: it serves nothing. It claims commands and uploads.
    command: ["python", "-m", "app.publisher"]
    # Long enough for an in-flight upload to finish rather than being killed mid-chunk.
    stop_grace_period: 60s

  voxmind-worker-base:
    build:
      context: ./worker
      dockerfile: Dockerfile.gpu.base
      args:
        POETRY_INSTALL_GROUPS: ${WORKER_POETRY_GROUPS:-diarization}
        TORCH_FLAVOR: ${WORKER_TORCH_FLAVOR:-gpu}
        PRELOAD_ASR_MODELS: ${WORKER_PRELOAD_ASR_MODELS:-small,base}
    image: ${VOXMIND_WORKER_BASE_IMAGE:-clipflow-worker-base:local}
    command: ["/bin/true"]
    restart: "no"

  voxmind-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.gpu
      additional_contexts:
        workerbase: "service:voxmind-worker-base"
      args:
        BASE_IMAGE: workerbase
    image: ${VOXMIND_WORKER_IMAGE:-clipflow-worker:local}
    container_name: voxmind-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clipflow-api:
        condition: service_healthy
    environment:
      WORKER_MODE: queue
      WORKER_ID: ${WORKER_ID:-}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      WORKER_VISIBILITY_TIMEOUT_SEC: ${WORKER_VISIBILITY_TIMEOUT_SEC:-900}
      WORKER_HEARTBEAT_INTERVAL_SEC: ${WORKER_HEARTBEAT_INTERVAL_SEC:-15}
      WORKER_HEARTBEAT_TTL_SEC: ${WORKER_HEARTBEAT_TTL_SEC:-60}
      WORKER_RETRY_BACKOFF_BASE_SEC: ${WORKER_RETRY_BACKOFF_BASE_SEC:-30}
      WORKER_RETRY_BACKOFF_MAX_SEC: ${WORKER_RETRY_BACKOFF_MAX_SEC:-600}
      WORKER_CLAIM_BLOCK_SEC: ${WORKER_CLAIM_BLOCK_SEC:-5}
      KEEP_WORKDIR_ON_FAILURE: ${KEEP_WORKDIR_ON_FAILURE:-false}
      DOWNLOAD_TIMEOUT_SEC: ${DOWNLOAD_TIMEOUT_SEC:-3600}
      FFMPEG_TIMEOUT_SEC: ${FFMPEG_TIMEOUT_SEC:-3600}
      FFPROBE_TIMEOUT_SEC: ${FFPROBE_TIMEOUT_SEC:-120}
      SUBPROCESS_STDERR_CAPTURE_CHARS: ${SUBPROCESS_STDERR_CAPTURE_CHARS:-4000}
      AI_MODE: ${AI_MODE:-automatic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-false}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:8b}
      LOG_LEVEL: ${WORKER_LOG_LEVEL}
      VIDEO_URL: ""
      PIPELINE_STAGE: prepare
      WORK_DIR: /work
      ASR_MODEL_SIZE: ${ASR_MODEL_SIZE}
      ASR_DEVICE: ${ASR_DEVICE}
      ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE}
      ASR_CPU_THREADS: ${ASR_CPU_THREADS}
      ASR_BEAM_SIZE: ${ASR_BEAM_SIZE}
      ASR_VAD_FILTER: ${ASR_VAD_FILTER}
      ASR_WINDOW_DURATION_SEC: ${ASR_WINDOW_DURATION_SEC:-${ASR_SEGMENT_DURATION_SEC:-900}}
      ASR_WINDOW_OVERLAP_SEC: ${ASR_WINDOW_OVERLAP_SEC:-5}
      ASR_WORD_TIMESTAMPS: ${ASR_WORD_TIMESTAMPS:-false}
      ASR_SEAM_MIN_TEMPORAL_IOU: ${ASR_SEAM_MIN_TEMPORAL_IOU:-0.30}
      ASR_SEAM_MIN_TEXT_SIMILARITY: ${ASR_SEAM_MIN_TEXT_SIMILARITY:-0.60}
      ASR_SEAM_STRONG_TEXT_SIMILARITY: ${ASR_SEAM_STRONG_TEXT_SIMILARITY:-0.85}
      ASR_STRIP_FILLERS: ${ASR_STRIP_FILLERS:-false}
      ASR_PARALLEL_WORKERS: ${ASR_PARALLEL_WORKERS}
      ASR_MAX_MERGED_SEGMENT_DURATION_SEC: ${ASR_MAX_MERGED_SEGMENT_DURATION_SEC}
      DIARIZATION_ENABLED: ${DIARIZATION_ENABLED}
      DIARIZATION_MODEL_NAME: ${DIARIZATION_MODEL_NAME}
      DIARIZATION_DEVICE: ${DIARIZATION_DEVICE}
      DIARIZATION_HF_TOKEN: ${DIARIZATION_HF_TOKEN}
      DIARIZATION_MIN_OVERLAP_SEC: ${DIARIZATION_MIN_OVERLAP_SEC}
      RENDER_MIN_CLIP_DURATION_SEC: ${RENDER_MIN_CLIP_DURATION_SEC}
      RENDER_BOUNDARY_SNAP_TOLERANCE_SEC: ${RENDER_BOUNDARY_SNAP_TOLERANCE_SEC}
      QA_ENABLED: ${QA_ENABLED}
      AUTO_REVIEW_ENABLED: ${AUTO_REVIEW_ENABLED}
      AUTO_REVIEW_READY_SCORE_THRESHOLD: ${AUTO_REVIEW_READY_SCORE_THRESHOLD}
      AUTO_REVIEW_BLOCKED_SCORE_THRESHOLD: ${AUTO_REVIEW_BLOCKED_SCORE_THRESHOLD}
      AUTO_REVIEW_MAX_REVIEW_CLIPS: ${AUTO_REVIEW_MAX_REVIEW_CLIPS}
      FINAL_QA_ENABLED: ${FINAL_QA_ENABLED:-true}
      FINAL_QA_DURATION_TOLERANCE_SEC: ${FINAL_QA_DURATION_TOLERANCE_SEC:-1.5}
      FINAL_QA_MAX_SILENCE_SEC: ${FINAL_QA_MAX_SILENCE_SEC:-8}
      FINAL_QA_BLACK_RATIO: ${FINAL_QA_BLACK_RATIO:-0.60}
      FINAL_QA_MAX_FREEZE_SEC: ${FINAL_QA_MAX_FREEZE_SEC:-4}
      FINAL_QA_DECODE_TIMEOUT_SEC: ${FINAL_QA_DECODE_TIMEOUT_SEC:-900}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_DISABLE_NOTIFICATIONS: ${TELEGRAM_DISABLE_NOTIFICATIONS}
      TELEGRAM_TIMEOUT_SEC: ${TELEGRAM_TIMEOUT_SEC}
      TELEGRAM_UPLOAD_TIMEOUT_SEC: ${TELEGRAM_UPLOAD_TIMEOUT_SEC}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      HF_HOME: /cache
      TRANSFORMERS_CACHE: /cache
      HF_HUB_CACHE: /cache/huggingface/hub
      TORCH_HOME: /cache/torch
      PYANNOTE_CACHE: /cache/pyannote
      SPEECHBRAIN_CACHE_DIR: /cache/speechbrain
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
      MPLCONFIGDIR: /tmp/matplotlib
      HOME: /tmp/home
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES}
      CLIPFLOW_API_ENABLED: ${CLIPFLOW_API_ENABLED}
      CLIPFLOW_API_BASE_URL: http://clipflow-api:8000
      CLIPFLOW_API_TIMEOUT_SEC: ${CLIPFLOW_API_TIMEOUT_SEC}
      CLIPFLOW_API_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN}
      VOXMIND_REDIS_HOST: redis
      VOXMIND_REDIS_PORT: 6379
      VOXMIND_REDIS_QUEUE: ${VOXMIND_REDIS_QUEUE}
    volumes:
      - worker_work:/work
      - worker_cache:/cache
      - worker_tmp:/tmp
      - ./worker/assets:/app/assets:ro
    gpus: all

  voxmind-control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    image: ${VOXMIND_CONTROL_PLANE_IMAGE:-clipflow-control-plane:local}
    container_name: voxmind-control-plane
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      ENV: docker
      LOG_LEVEL: ${CONTROL_PLANE_LOG_LEVEL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      VOXMIND_REDIS_HOST: redis
      VOXMIND_REDIS_PORT: 6379
      VOXMIND_REDIS_QUEUE: ${VOXMIND_REDIS_QUEUE}
      MIN_CUT_DURATION_SEC: ${MIN_CUT_DURATION_SEC}
      SHORT_SERIE_MAX_GAP_SEC: ${SHORT_SERIE_MAX_GAP_SEC}
      HEALTH_HOST: 0.0.0.0
      HEALTH_PORT: 8000
      CLIPFLOW_API_BASE_URL: http://clipflow-api:8000
      CLIPFLOW_API_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN}
    ports:
      - "${CONTROL_PLANE_PORT:-8000}:8000"
    volumes:
      - control_plane_tmp:/tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # NOTE: the `clipflow-studio` service was removed in PR-BOOT-01. The frontend has never
  # existed in this repository (it is listed in .gitignore and has no git history), so the
  # service could never start and blocked `docker compose up`. It will be restored in a
  # dedicated PR. See README "Frontend".

volumes:
  redis_data:
  minio_data:
  postgres_data:
  worker_work:
  worker_cache:
  worker_tmp:
  control_plane_tmp:
